name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project files
        run: |
          flutter create --project-name daily_azkar --platforms=android --org com.example .
          rm -f test/widget_test.dart

      - name: Add internet permission and app name
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Release builds need INTERNET to stream recitations.
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET"/>|' "$MANIFEST"
          sed -i 's|android:label="[^"]*"|android:label="እስላማዊ አዝካር"|' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST"

      - name: Enable Android core library desugaring
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' "$GRADLE_FILE"
            sed -i '/dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' "$GRADLE_FILE"
          fi

      - name: Install packages
        run: flutter pub get

      - name: Check code (report only)
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-azkar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
