name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project files
        run: |
          flutter create --project-name daily_azkar --platforms=android --org com.example .
          rm -f test/widget_test.dart

      - name: Configure Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          if "android.permission.INTERNET" not in text:
              text = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                  text,
                  count=1
              )

          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="እስላማዊ አዝካር"',
              text,
              count=1
          )

          path.write_text(text)
          PY

      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          gradle = next((p for p in candidates if p.exists()), None)

          if gradle is None:
              raise SystemExit("ERROR: Android Gradle file not found")

          text = gradle.read_text()
          kotlin_dsl = gradle.name.endswith(".kts")

          if "compileOptions {" not in text:
              raise SystemExit("ERROR: compileOptions block not found")

          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              setting = (
                  "        isCoreLibraryDesugaringEnabled = true"
                  if kotlin_dsl
                  else "        coreLibraryDesugaringEnabled true"
              )
              text = re.sub(
                  r'compileOptions\s*\{',
                  lambda m: m.group(0) + "\n" + setting,
                  text,
                  count=1
              )

          if "desugar_jdk_libs" not in text:
              dependency = (
                  '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                  if kotlin_dsl
                  else '    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"'
              )

              if not re.search(r'\bdependencies\s*\{', text):
                  raise SystemExit("ERROR: dependencies block not found")

              text = re.sub(
                  r'dependencies\s*\{',
                  lambda m: m.group(0) + "\n" + dependency,
                  text,
                  count=1
              )

          gradle.write_text(text)
          print(f"Configured {gradle}")
          PY

      - name: Install packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-azkar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
